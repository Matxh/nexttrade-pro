<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background rounded square -->
  <rect width="400" height="400" rx="60" ry="60" fill="#00FF88"/>

  <!-- Candlesticks (5 candles, centered group) -->
  <!-- Far left candle (shortest, low opacity) -->
  <g opacity="0.12">
    <line x1="108" y1="115" x2="108" y2="105" stroke="#0B0B0B" stroke-width="2.5"/>
    <rect x="98" y="135" width="20" height="55" rx="2" fill="#0B0B0B"/>
    <line x1="108" y1="190" x2="108" y2="205" stroke="#0B0B0B" stroke-width="2.5"/>
  </g>

  <!-- Left-center candle (medium, low opacity) -->
  <g opacity="0.22">
    <line x1="158" y1="100" x2="158" y2="88" stroke="#0B0B0B" stroke-width="2.5"/>
    <rect x="148" y="118" width="20" height="72" rx="2" fill="#0B0B0B"/>
    <line x1="158" y1="190" x2="158" y2="208" stroke="#0B0B0B" stroke-width="2.5"/>
  </g>

  <!-- Hero center candle (tallest, solid) -->
  <line x1="208" y1="68" x2="208" y2="52" stroke="#0B0B0B" stroke-width="3"/>
  <rect x="195" y="88" width="26" height="110" rx="3" fill="#0B0B0B"/>
  <line x1="208" y1="198" x2="208" y2="215" stroke="#0B0B0B" stroke-width="3"/>
  <!-- Upward arrow above hero candle -->
  <polygon points="208,32 220,56 196,56" fill="#0B0B0B"/>

  <!-- Right-center candle (medium, low opacity) -->
  <g opacity="0.22">
    <line x1="258" y1="100" x2="258" y2="88" stroke="#0B0B0B" stroke-width="2.5"/>
    <rect x="248" y="118" width="20" height="72" rx="2" fill="#0B0B0B"/>
    <line x1="258" y1="190" x2="258" y2="208" stroke="#0B0B0B" stroke-width="2.5"/>
  </g>

  <!-- Far right candle (shortest, low opacity) -->
  <g opacity="0.12">
    <line x1="308" y1="115" x2="308" y2="105" stroke="#0B0B0B" stroke-width="2.5"/>
    <rect x="298" y="135" width="20" height="55" rx="2" fill="#0B0B0B"/>
    <line x1="308" y1="190" x2="308" y2="205" stroke="#0B0B0B" stroke-width="2.5"/>
  </g>

  <!-- Horizontal divider line -->
  <line x1="40" y1="235" x2="360" y2="235" stroke="#0B0B0B" stroke-width="2.5"/>

  <!-- PriceAction text -->
  <text x="200" y="292" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="42" fill="#0B0B0B" text-anchor="middle" letter-spacing="-1">PriceAction</text>

  <!-- AI badge -->
  <rect x="148" y="308" width="104" height="46" rx="10" fill="#0B0B0B"/>
  <text x="200" y="341" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#00FF88" text-anchor="middle" letter-spacing="8">AI</text>
</svg>
